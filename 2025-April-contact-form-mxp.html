    JotForm.newPaymentUI = true;

    JotForm.isFormViewTrackingAllowed = true;
    JotForm.replaceTagTest = true;
    JotForm.uploadServerURL = "https://upload.jotform.com/upload";
    
    // (Optional) Set up your conditions here...
    JotForm.setConditions([{
      "action": [
        {"id": "action_1744052214672", "visibility": "Show", "isError": false, "field": "4"}
      ],
      "id": "1744052226628",
      "index": "0",

    }]);
    JotForm.clearFieldOnHide = "disable";
    JotForm.submitError = "jumpToFirstError";
    JotForm.isFullSource = true;
    
    JotForm.init(function(){
      // Any additional init actions...
    });
    
    // Attach a listener once the DOM is ready.
    document.addEventListener("DOMContentLoaded", function() {
      var formElement = document.getElementById("250965736128061");
      if (formElement) {
        formElement.addEventListener("submit", function(event) {
          // Delay slightly to let Jotform process the submission.
          setTimeout(function(){
            var emailField = document.getElementById("input_3");
            var emailValue = emailField ? emailField.value : "";
            // Send the email value to the parent window.
            window.parent.postMessage({ type: "jotformSubmission", data: { email: emailValue } }, "*");
          }, 500);
        });
      }
    });
  </script>
  
  <!-- Jotform Form HTML -->
